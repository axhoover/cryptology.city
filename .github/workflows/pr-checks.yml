name: PR checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Content lint (schema, wikilinks, aliases, macros)
        run: node scripts/lint.mjs

      - name: Quartz build
        run: npx quartz build
