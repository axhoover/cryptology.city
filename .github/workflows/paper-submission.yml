name: Paper submission

# Triggered by repository_dispatch from the submission Worker.
# Payload shape (client_payload):
#   {
#     paper: { type: "pdf" | "url", url: "<signed-download-url | eprint-url>" },
#     notes: "<submitter notes>",
#     submitted_at: "<ISO timestamp>"
#   }

on:
  repository_dispatch:
    types: [paper_submission]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: paper-submission-${{ github.event.client_payload.submitted_at }}
  cancel-in-progress: false

jobs:
  draft-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The prompt greps vendor/cryptobib/crypto.bib for the paper's
          # citation key. Without this the path does not exist and every
          # lookup silently misses.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # scripts/lint.mjs and scripts/generate-relations.mjs need gray-matter
      # and js-yaml, and the agent has to be able to run them before opening a
      # PR — the repository's PR checks workflow is disabled, so this run is
      # the only gate a submission passes through.
      - run: npm ci

      - name: Stage submission
        id: stage
        env:
          PAPER_TYPE: ${{ github.event.client_payload.paper.type }}
          PAPER_URL: ${{ github.event.client_payload.paper.url }}
          PAPER_SOURCE_URL: ${{ github.event.client_payload.paper.source_url }}
          NOTES: ${{ github.event.client_payload.notes }}
          SUBMITTED_AT: ${{ github.event.client_payload.submitted_at }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/submission"
          mkdir -p "$STAGE"

          # Always record metadata for the prompt to read
          jq -n \
            --arg type "$PAPER_TYPE" \
            --arg url "$PAPER_URL" \
            --arg source_url "$PAPER_SOURCE_URL" \
            --arg notes "$NOTES" \
            --arg submitted_at "$SUBMITTED_AT" \
            '{type:$type, url:$url, source_url:$source_url, notes:$notes, submitted_at:$submitted_at}' \
            > "$STAGE/submission.json"

          if [ "$PAPER_TYPE" = "pdf" ]; then
            echo "Downloading PDF from signed URL"
            curl -fsSL --max-time 60 -o "$STAGE/paper.pdf" "$PAPER_URL"
            file "$STAGE/paper.pdf" | grep -q "PDF document" || { echo "Downloaded file is not a PDF"; exit 1; }
          else
            echo "eprint URL submission; Claude will fetch the paper via WebFetch"
          fi

          echo "stage_dir=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Compose prompt
        id: prompt
        env:
          STAGE_DIR: ${{ steps.stage.outputs.stage_dir }}
        run: |
          set -euo pipefail
          # The persistent prompt template lives in the repo and is edited by hand.
          # This step prepends the submission-specific context to it.
          TEMPLATE_PATH=".github/prompts/paper-submission.md"
          if [ ! -f "$TEMPLATE_PATH" ]; then
            echo "Prompt template not found at $TEMPLATE_PATH"; exit 1
          fi

          PROMPT_FILE="$STAGE_DIR/prompt.md"
          {
            echo "# Paper submission task"
            echo ""
            echo "A new paper has been submitted via the public intake form. Your task"
            echo "is described in the template below."
            echo ""
            echo "## Submission metadata"
            echo ""
            echo '```json'
            cat "$STAGE_DIR/submission.json"
            echo ""
            echo '```'
            echo ""
            if [ -f "$STAGE_DIR/paper.pdf" ]; then
              echo "## Paper location"
              echo ""
              echo "- A PDF has been staged at: \`$STAGE_DIR/paper.pdf\`"
              echo "- Use the Read tool to read the PDF."
              echo "- If \`source_url\` is set in the metadata above, treat it as the canonical citation URL."
            else
              echo "## Paper location"
              echo ""
              echo "- No PDF was uploaded. Use WebFetch on the URL in the metadata above."
              echo "- IACR eprint:  \`/YYYY/N\`        -> PDF at \`/YYYY/N.pdf\` (no trailing slash)."
              echo "- arXiv:        \`/abs/<id>\`      -> PDF at \`/pdf/<id>\`."
              echo "- ECCC:         \`/report/YYYY/N/\` -> PDF at \`/report/YYYY/N/download/\`."
              echo "- ia.cr:        short link, resolves to eprint.iacr.org."
            fi
            echo ""
            echo "## Editorial instructions"
            echo ""
            cat "$TEMPLATE_PATH"
          } > "$PROMPT_FILE"

          echo "prompt_file=$PROMPT_FILE" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Read and follow the instructions in the prompt file at
            ${{ steps.prompt.outputs.prompt_file }}.

            Create your work on a new branch (do not commit to main), then open a
            pull request titled with the paper's title and a body that includes
            the drafted critique, the citation entry, and any flags about
            uncertainty in your reading. The PR should be marked as a draft.
          claude_args: |
            --allowed-tools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(find:*),Bash(file:*),Bash(jq:*),Bash(npm:*),Bash(npx:*),Bash(node:*),WebFetch,WebSearch"
            --max-turns 60

      # Deterministic gate. The prompt asks the agent to run these before
      # opening the PR; this re-runs them on whatever it actually committed, so
      # a submission cannot land content that fails the schema, leaves the
      # generated manifest stale, or breaks the build. Same principle as
      # docs/microcrypt-sync.md: the checks a model could silently get wrong
      # are done in code, not in prose.
      - name: Verify what the agent committed
        if: always()
        run: |
          set -uo pipefail
          echo "Verifying on branch: $(git rev-parse --abbrev-ref HEAD)"
          status=0

          echo "::group::Content lint"
          node scripts/lint.mjs || status=1
          echo "::endgroup::"

          echo "::group::Generated regions and relations.json"
          node scripts/generate-relations.mjs --check || status=1
          echo "::endgroup::"

          echo "::group::Quartz build"
          npx quartz build || status=1
          echo "::endgroup::"

          if [ "$status" -ne 0 ]; then
            echo "::error::A submission PR was produced that does not pass the repository checks. Treat the PR as unmergeable and read the groups above; the lint names the file, the field, and a valid example."
          fi
          echo "verify_status=$status" >> "$GITHUB_OUTPUT"
          exit $status
        id: verify

      # Say so on the PR itself. A reviewer should not have to open the Actions
      # log to learn that the draft in front of them does not build.
      - name: Flag a failing submission on its PR
        if: always() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          PR="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "${PR:-}" ]; then
            echo "No PR for $BRANCH; nothing to annotate."
            exit 0
          fi
          # printf, not a heredoc: this block is indented inside the YAML, and a
          # heredoc would carry the leading spaces into the comment, rendering
          # the whole body as one code block.
          BODY_FILE="$RUNNER_TEMP/pr-comment.md"
          printf '%s\n' \
            '**This draft does not pass the repository checks and is not mergeable as-is.**' \
            '' \
            'The workflow re-runs `scripts/lint.mjs`, `scripts/generate-relations.mjs --check`' \
            'and `npx quartz build` against whatever the agent committed. One of them failed;' \
            'the job log shows which, grouped by check.' \
            '' \
            'Common causes, in order of likelihood:' \
            '' \
            '- a reduction names an object id that does not exist (`edge-unresolved-id`)' \
            '- `class` is `black-box`, or another value that is not an RTV notion' \
            '- `.reductions/relations.json` is stale - run `node scripts/generate-relations.mjs`' \
            '- a generated `participates-in` region was hand-edited' \
            > "$BODY_FILE"
          gh pr comment "$PR" --body-file "$BODY_FILE"
