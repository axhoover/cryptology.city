# schema/propositions.yaml
#
# Proposition-typed nodes: things a barrier's `consequence` can point at that are
# NOT wiki objects. The Phase-1 audit found 17 barrier records with
# consequence.kind: complexity and NOT ONE of their targets resolved to a page.
# Rather than create 17 content pages, they resolve here.
#
# The lint resolves consequence.target by its kind:
#   kind: object      -> an object page `id` or a `variants` key
#   kind: complexity  -> a key in this file
#   kind: reduction   -> a reduction `id` under content/Reductions/
#   kind: contradiction -> target must be empty
#
# `believed:` records the community's working belief, and is what the lint's SOFT
# FLAGS read: a reduction whose existence a barrier says would imply something
# with believed: false is "this would be a major result -- confirm the class",
# never a hard error. A barrier consequence with believed: true is a warning:
# forcing something proved or expected rules nothing out, so the page is
# usually a reduction or a proved fact, unless the target is an open problem
# whose proof would itself be a major result (p-neq-np for Impagliazzo-Rudich).

version: 1

propositions:
  p-neq-np:
    title: $\classP \neq \classNP$
    believed: true
    page: Complexity/nondeterministic-polynomial-time
    note: >-
      The consequence of Impagliazzo-Rudich in its general form: a proof that
      one-way permutations imply key agreement would prove P != NP.

  p-eq-np:
    title: $\classP = \classNP$
    believed: false
    page: Complexity/nondeterministic-polynomial-time

  np-subset-bpp:
    title: $\classNP \subseteq \classBPP$
    believed: false
    page: Complexity/bounded-error-probabilistic-polynomial-time

  np-eq-conp:
    title: $\classNP = \classcoNP$
    believed: false
    page: Complexity/co-nondeterministic-polynomial-time

  conp-subset-am:
    title: $\classcoNP \subseteq \classAM$
    believed: false
    page: Complexity/arthur-merlin
    note: >-
      Consequence of the AGGM06 barrier (no-np-to-hash-function-aggm06: a
      non-adaptive reduction from NP to inverting a OWF), the LV15 barrier
      (no-np-to-cpir-lv15) and the BL13 barrier (no-he-to-szk-bl13, for
      general adaptive reductions). It implies ph-collapse-second-level — BHZ87.

  ph-collapse:
    title: The polynomial hierarchy collapses
    believed: false
    page: Complexity/polynomial-time-hierarchy

  szk-neq-bpp:
    title: $\classSZK \neq \classBPP$
    believed: true
    page: Complexity/statistical-zero-knowledge

  ma-neq-np:
    title: $\classMA \neq \classNP$
    believed: true
    page: Complexity/merlin-arthur
    note: Requires circuit lower bounds; see content/Complexity/merlin-arthur.md:26.

  contradiction:
    title: Contradiction
    believed: false
    note: >-
      Reserved. Do NOT use as a consequence.target -- set
      consequence.kind: contradiction with an empty target instead.

  circuit-lower-bounds:
    title: "Superpolynomial circuit lower bounds beyond what is currently known"
    believed: true

  czk-eq-ip:
    title: ""
    believed: true

  czk-neq-bpp:
    title: "$\\classCZK \\neq \\classBPP$"
    believed: true

  dpf-key-size-lower-bound:
    title: ""
    believed: true

  exp-neq-nexp:
    title: "$\\classEXP \\neq \\mathbf{NEXP}$"
    believed: true

  exp-neq-p:
    title: "$\\classEXP \\neq \\classP$"
    believed: true

  grover-optimal:
    title: "Grover's algorithm is query-optimal for unstructured search"
    believed: true

  np-complete-in-conp:
    title: "Some $\\classNP$-complete problem lies in $\\classcoNP$"
    believed: false

  np-complete-in-szk:
    title: "Some $\\classNP$-complete problem lies in $\\classSZK$"
    believed: false

  np-easy-on-average:
    title: "$\\classNP$ is easy on average"
    believed: false

  np-hard-on-average:
    title: "$\\classNP$ is hard on average"
    believed: true

  np-subset-czk:
    title: "$\\classNP \\subseteq \\classCZK$"
    believed: true

  np-subset-ppoly:
    title: "$\\classNP \\subseteq \\classPpoly$"
    believed: false

  one-round-oram-omega-sqrt-n:
    title: "Every one-round balls-in-bins ORAM has $\\Omega(\\sqrt{n})$ overhead or storage"
    believed: true

  oram-omega-log-n-overhead:
    title: "Every ORAM incurs $\\Omega(\\log n)$ amortized overhead"
    believed: true

  p-eq-bpp:
    title: "$\\classP = \\classBPP$"
    believed: true

  p-neq-ppoly-cap-np:
    title: "$\\classP \\neq \\classPpoly \\cap \\classNP$"
    believed: true

  ph-collapse-second-level:
    title: "The polynomial hierarchy collapses to its second level"
    believed: false

  pir-omega-n-public-key-ops:
    title: "Every single-server PIR requires $\\Omega(n)$ public-key operations"
    believed: true

  qcma-neq-qma:
    title: "$\\classQCMA \\neq \\classQMA$"
    believed: true

  qcma-neq-qma-relative-to-oracle:
    title: "$\\classQCMA \\neq \\classQMA$ relative to a quantum oracle"
    believed: true

  qma-internally-separable-below-qma-2:
    title: "$\\classQMA$ with internally separable proofs is strictly weaker than $\\classQMA(2)$"
    believed: true

  superlinear-sorting-circuit-lower-bound:
    title: ""
    believed: true

  tfnp-np-hard:
    title: ""
    believed: false
